name: Publicar instalador

# Al subir una etiqueta de versión (por ejemplo v1.2.0) se compila el instalador
# de Windows y se publica en GitHub Releases; la app instalada se actualiza sola.
# Se compila sin publicar y luego se sube todo en un solo paso con gh, porque la
# publicación directa de electron-builder llegó a crear dos releases a la vez.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Compilar instalador
        run: npx electron-builder --win --publish never
      - name: Publicar en Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/PST-Explorer-Setup-*.exe dist/PST-Explorer-Setup-*.exe.blockmap dist/latest.yml \
            --title "PST Explorer ${{ github.ref_name }}" \
            --notes "Instalador para Windows: descarga PST-Explorer-Setup-*.exe. Si ya tienes PST Explorer instalado, se actualiza solo."
