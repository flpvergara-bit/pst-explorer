name: Publish installer

# Pushing a version tag (for example v1.2.0) builds the Windows installer
# and publishes it to GitHub Releases; the installed app updates itself.
# It builds without publishing and then uploads everything in one step with gh,
# because electron-builder's direct publishing once created two releases at once.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build installer
        run: npx electron-builder --win --publish never
      - name: Publish to Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/PST-Explorer-Setup-*.exe dist/PST-Explorer-Setup-*.exe.blockmap dist/latest.yml \
            --title "PST Explorer ${{ github.ref_name }}" \
            --notes "Windows installer: download PST-Explorer-Setup-*.exe. If PST Explorer is already installed, it updates itself."
