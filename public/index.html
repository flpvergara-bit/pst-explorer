<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PST Explorer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='6' width='28' height='20' rx='3' fill='%231f6feb'/%3E%3Cpath d='M3 8l13 9 13-9' stroke='white' stroke-width='2.5' fill='none'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="top">
    <div class="brand" title="PST Explorer">
      <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true"><rect x="2" y="6" width="28" height="20" rx="3" fill="currentColor"/><path d="M3 8l13 9 13-9" stroke="var(--bg)" stroke-width="2.5" fill="none"/></svg>
      <span>PST Explorer</span>
    </div>
    <button id="btnLib" class="btn primary" data-i18n="top.library" data-i18n-title="top.libraryTitle">Library</button>

    <div class="search-wrap">
      <div class="search">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="q" type="search" autocomplete="off" spellcheck="false" data-i18n-ph="search.ph">
        <select id="scope" data-i18n-title="search.scopeTitle">
          <option value="all" data-i18n="scope.all">All files</option>
          <option value="file" data-i18n="scope.file">Current file</option>
          <option value="folder" data-i18n="scope.folder">Current folder</option>
          <option value="foldersub" data-i18n="scope.foldersub">Folder and subfolders</option>
        </select>
        <button id="btnAdv" class="btn ghost" data-i18n="search.filters" data-i18n-title="search.filtersTitle">Filters</button>
        <button id="btnHelp" class="btn ghost icon" data-i18n-title="search.helpTitle">?</button>
      </div>
      <div id="chips" class="chips"></div>
    </div>

    <div id="progress" class="progress" hidden data-i18n-title="top.progressTitle">
      <div class="ptext"></div>
      <div class="pbar"><div></div></div>
    </div>
    <select id="langSel" class="lang-sel" data-i18n-title="top.langTitle" aria-label="Language">
      <option value="en">English</option>
      <option value="es">Español</option>
    </select>
    <div class="menu-wrap">
      <button id="btnMenu" class="btn ghost" data-i18n="menu.button" data-i18n-title="menu.title">Export ▾</button>
      <div id="menu" class="menu" hidden>
        <div class="menu-title" data-i18n="menu.current">Current results</div>
        <button data-act="csv" data-i18n="menu.csv">Email list (Excel/CSV)</button>
        <button data-act="attzip" data-i18n="menu.attzip">All attachments (ZIP, by email)</button>
        <button data-act="attzipflat" data-i18n="menu.attzipflat">All attachments (ZIP, single folder)</button>
        <button data-act="emlzip" data-i18n="menu.emlzip">Emails as .eml (ZIP)</button>
        <button data-act="print" data-i18n="menu.print">Print results (max. 200)</button>
        <hr>
        <button data-act="library" data-i18n="menu.library">File library…</button>
        <button data-act="compare" data-i18n="menu.compare">Compare files (duplicates)…</button>
        <button data-act="pause" id="menuPause" data-i18n="menu.pause">Pause indexing</button>
      </div>
    </div>
  </header>

  <section id="advPanel" class="adv" hidden>
    <form id="advForm" autocomplete="off">
      <label><span data-i18n="adv.from">From</span><input name="from" data-i18n-ph="adv.nameOrEmail"></label>
      <label><span data-i18n="adv.to">To / CC</span><input name="to" data-i18n-ph="adv.nameOrEmail"></label>
      <label><span data-i18n="adv.subject">Subject</span><input name="subject"></label>
      <label><span data-i18n="adv.body">In the body</span><input name="body"></label>
      <label><span data-i18n="adv.attName">Attachment name</span><input name="attname" data-i18n-ph="adv.attNamePh"></label>
      <label><span data-i18n="adv.content">Inside attachments</span><input name="content" data-i18n-ph="adv.contentPh"></label>
      <label><span data-i18n="adv.without">Without these words</span><input name="without"></label>
      <label><span data-i18n="adv.dateFrom">Date from</span><input name="dateFrom" type="date"></label>
      <label><span data-i18n="adv.dateTo">Date to</span><input name="dateTo" type="date"></label>
      <label><span data-i18n="adv.attType">Attachment type</span>
        <select name="attext">
          <option value="" data-i18n="adv.any">Any</option>
          <option value="pdf">PDF</option>
          <option value="xls,xlsx,xlsm,csv">Excel / CSV</option>
          <option value="doc,docx">Word</option>
          <option value="ppt,pptx">PowerPoint</option>
          <option value="jpg,jpeg,png,gif,bmp,tif,tiff,heic" data-i18n="adv.images">Images</option>
          <option value="zip,rar,7z" data-i18n="adv.archives">Archives</option>
          <option value="xml" data-i18n="adv.xml">XML (e-invoices)</option>
          <option value="eml,msg" data-i18n="adv.emails">Attached emails</option>
        </select>
      </label>
      <div class="checks">
        <label class="ck"><input type="checkbox" name="att"> <span data-i18n="adv.att">Only with attachments</span></label>
        <label class="ck"><input type="checkbox" name="unread"> <span data-i18n="adv.unread">Only unread</span></label>
        <label class="ck"><input type="checkbox" name="mail"> <span data-i18n="adv.mail">Only emails (no appointments/contacts)</span></label>
        <label class="ck"><input type="checkbox" name="inatt" checked> <span data-i18n="adv.inatt">Also search inside attachments</span></label>
        <label class="ck" data-i18n-title="adv.dupsTitle"><input type="checkbox" name="dups"> <span data-i18n="adv.dups">Show duplicate copies across backups</span></label>
      </div>
      <div class="adv-actions">
        <button type="button" id="advClear" class="btn ghost" data-i18n="adv.clear">Clear</button>
        <button type="submit" class="btn primary" data-i18n="adv.search">Search</button>
      </div>
    </form>
  </section>

  <main id="layout" class="layout">
    <nav id="sidebar" class="sidebar">
      <div class="views">
        <button data-view="mail" class="view active"><svg class="i" viewBox="0 0 24 24"><path d="M3 6h18v12H3zM3 7l9 7 9-7"/></svg> <span data-i18n="view.mail">Emails</span></button>
        <button data-view="threads" class="view"><svg class="i" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg> <span data-i18n="view.threads">Conversations</span></button>
        <button data-view="attachments" class="view"><svg class="i" viewBox="0 0 24 24"><path d="M16.5 6.5l-8.3 8.3a2 2 0 0 0 2.8 2.8l8.5-8.5a4 4 0 0 0-5.7-5.7L5.3 11.9a6 6 0 0 0 8.5 8.5l6.7-6.7"/></svg> <span data-i18n="view.attachments">Attachments</span></button>
      </div>
      <div class="tree-head">
        <span data-i18n="tree.folders">Folders</span>
        <label class="ck small" data-i18n-title="tree.hideEmptyTitle"><input type="checkbox" id="hideEmpty" checked> <span data-i18n="tree.hideEmpty">hide empty</span></label>
      </div>
      <div id="tree" class="tree"></div>
    </nav>
    <div class="splitter" data-split="side"></div>

    <section class="list-pane">
      <div class="list-head">
        <div class="list-title"><strong id="listTitle">—</strong> <span id="listCount" class="muted"></span></div>
        <div class="list-tools">
          <select id="sort" data-i18n-title="sort.title"></select>
          <button id="dir" class="btn ghost icon" data-i18n-title="sort.dirTitle">↓</button>
        </div>
      </div>
      <div id="attBar" class="att-bar" hidden>
        <input id="attName" type="search" data-i18n-ph="att.namePh">
        <div id="extChips" class="ext-chips"></div>
        <div class="att-sel"><span id="attSelCount"></span><button id="attSelZip" class="btn small" disabled data-i18n="att.selZip">Download selected (ZIP)</button></div>
      </div>
      <div id="list" class="vlist" tabindex="0"><div class="vspacer"></div><div class="vrows"></div></div>
      <div id="listEmpty" class="list-empty" hidden></div>
    </section>
    <div class="splitter" data-split="list"></div>

    <section id="reader" class="reader">
      <div class="welcome">
        <h2 data-i18n="reader.welcome">Welcome</h2>
        <p data-i18n-html="reader.welcomeText"></p>
        <button class="btn primary" data-act="open" data-i18n="reader.addFiles">Add files…</button>
      </div>
    </section>
  </main>

  <dialog id="libDlg" class="dlg wide">
    <form method="dialog" class="dlg-inner">
      <header><h3 data-i18n="lib.title">File library</h3><button class="btn ghost icon" value="cancel" data-i18n-title="lib.close">✕</button></header>
      <div class="open-row">
        <button type="button" id="btnPickFiles" class="btn primary" data-i18n="lib.addFiles">Add files…</button>
        <button type="button" id="btnPickFolder" class="btn" data-i18n="lib.addFolder">Add folder…</button>
        <input id="pathInput" data-i18n-ph="lib.pathPh">
        <button type="button" id="btnAddPath" class="btn" data-i18n="lib.add">Add</button>
      </div>
      <p id="libMsg" class="lib-msg" hidden></p>
      <div id="libList" class="lib-list"></div>
      <div class="lib-foot">
        <span id="libSummary" class="muted"></span>
        <span class="lib-foot-btns">
          <button type="button" id="btnCompare" class="btn" data-i18n="lib.compare" data-i18n-title="lib.compareTitle">Compare files…</button>
          <button type="button" id="btnPause" class="btn" data-i18n="lib.pause">Pause indexing</button>
        </span>
      </div>
      <details id="browseBox">
        <summary data-i18n="lib.browse">Browse this computer's folders</summary>
        <div class="browse-path" id="browsePath"></div>
        <div id="browseList" class="browse"></div>
      </details>
      <p class="muted small-note" data-i18n="lib.note"></p>
      <p id="libNote" class="muted small-note"></p>
    </form>
  </dialog>

  <dialog id="cmpDlg" class="dlg wide">
    <form method="dialog" class="dlg-inner">
      <header><h3 data-i18n="cmp.title">Compare files</h3><button class="btn ghost icon" value="cancel" data-i18n-title="lib.close">✕</button></header>
      <p class="muted cmp-intro" data-i18n="cmp.intro"></p>
      <p id="cmpMsg" class="lib-msg" hidden></p>
      <div id="cmpBody"></div>
      <div class="lib-foot">
        <span id="cmpSummary" class="muted"></span>
        <button type="button" id="btnCmpRefresh" class="btn" data-i18n="cmp.recalc">Recalculate</button>
      </div>
      <p class="muted small-note" data-i18n-html="cmp.note"></p>
    </form>
  </dialog>

  <dialog id="helpDlg" class="dlg">
    <form method="dialog" class="dlg-inner help">
      <header><h3 data-i18n="help.title">How to search</h3><button class="btn ghost icon" value="cancel" data-i18n-title="lib.close">✕</button></header>
      <p data-i18n-html="help.intro"></p>
      <table><tbody data-i18n-html="help.table"></tbody></table>
      <p class="muted" data-i18n-html="help.tips"></p>
    </form>
  </dialog>

  <dialog id="headersDlg" class="dlg wide">
    <form method="dialog" class="dlg-inner">
      <header><h3 data-i18n="reader.headersTitle">Internet headers</h3><button class="btn ghost icon" value="cancel" data-i18n-title="lib.close">✕</button></header>
      <pre id="headersPre" class="headers"></pre>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
